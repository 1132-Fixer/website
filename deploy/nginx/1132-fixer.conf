# Nginx site config for 1132-fixer-download-page
# 1) Update `server_name`
# 2) If using TLS, uncomment the HTTPS server block and set cert paths

upstream fixer_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 1132-fixer.xyz www.1132-fixer.xyz 1132-fixer.primehostingdev.xyz;

    # Uncomment if TLS is enabled
    # return 301 https://$host$request_uri;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_pass http://fixer_app;
    }
}

